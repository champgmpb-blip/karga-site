
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>† Karga †</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at 50% 40%,
    #38204e 0%, #160e20 45%, #08070b 100%);
}

.card {
  width: min(90%, 390px);
  padding: 35px 25px;
  text-align: center;
  background: rgba(18, 14, 24, 0.82);
  border: 1px solid #654080;
  border-radius: 18px;
  box-shadow: 0 0 35px #8b5cf633;
  backdrop-filter: blur(12px);
}

.avatar {
  width: 100px;
  height: 100px;
  margin: 20px auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 2px solid #b66aff;
  background: linear-gradient(135deg,#281539,#09070c);
  color: #e9c8ff;
  font-size: 40px;
  box-shadow: 0 0 22px #a855f755;
}

h1 {
  color: #e6c9ff;
  margin: 10px 0;
  font-size: 27px;
}

.bio {
  color: #c4b5d8;
  font-size: 13px;
  line-height: 1.8;
  margin: 12px 0 22px;
}

.links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.links a {
  color: #ead8ff;
  text-decoration: none;
  padding: 10px 15px;
  border: 1px solid #674580;
  border-radius: 9px;
  font-size: 13px;
  transition: .2s;
}

.links a:hover {
  background: #603582;
  box-shadow: 0 0 15px #a855f766;
  transform: translateY(-2px);
}

#intro {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 15px;
  background: #09070c;
  transition: opacity .6s;
}

#intro h2 {
  color: #d8b4fe;
  letter-spacing: 5px;
}

#intro button {
  color: white;
  background: #281539;
  border: 1px solid #a855f7;
  padding: 12px 32px;
  border-radius: 8px;
  cursor: pointer;
}

#intro button:hover {
  background: #603582;
}

#intro.hidden {
  opacity: 0;
  pointer-events: none;
}

footer {
  color: #806b91;
  font-size: 11px;
  margin-top: 25px;
}
</style>
</head>
<body>

<div id="intro">
  <h2>† KARGA †</h2>
  <button onclick="enterSite()">ENTER</button>
</div>

<main class="card">
  <div class="avatar">K</div>
  <h1>† Helena Karga †</h1>
  <p class="bio">
    My art carries the feelings<br>
    my voice never could.
  </p>

  <div class="links">
    <a href="https://discord.com/" target="_blank">Discord</a>
    <a href="https://steamcommunity.com/" target="_blank">Steam</a>
    <a href="https://www.youtube.com/" target="_blank">YouTube</a>
  </div>

  <footer>Made by Karga · 2026</footer>
</main>

<script>
function enterSite() {
  document.getElementById("intro").classList.add("hidden");
}
</script>
</body>
</html>
