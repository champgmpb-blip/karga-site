from pathlib import Path

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09070d">
<meta name="description" content="Karga — personal profile">
<title>† Helena Karga †</title>
<style>
:root {
  --bg: #09070d;
  --panel: rgba(15, 12, 20, .72);
  --line: rgba(190, 125, 255, .35);
  --purple: #bd83f5;
  --purple-bright: #dfbaff;
  --muted: #b7a9c5;
  --text: #f6efff;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  overflow-x: hidden;
  color: var(--text);
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(85, 39, 119, .42), transparent 55%),
    linear-gradient(145deg, #100b16, #08070b 65%, #130b1b);
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,.55) 100%);
}
#particles { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.wrap { width: min(92vw, 430px); position: relative; z-index: 1; padding: 24px 0; }
.card {
  position: relative;
  overflow: hidden;
  padding: 30px 26px 22px;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--panel);
  box-shadow: 0 18px 70px rgba(0,0,0,.48), 0 0 34px rgba(168,85,247,.12), inset 0 1px rgba(255,255,255,.06);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  animation: rise .8s ease both;
}
.card::before {
  content: "";
  position: absolute;
  top: 0; left: 18%; right: 18%; height: 1px;
  background: linear-gradient(90deg, transparent, #d9b2ff, transparent);
  opacity: .8;
}
@keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
.avatar {
  width: 108px; height: 108px; margin: 2px auto 17px;
  border-radius: 50%;
  display: grid; place-items: center;
  overflow: hidden;
  border: 1px solid rgba(220,177,255,.85);
  background: linear-gradient(145deg,#38234c,#100c15);
  box-shadow: 0 0 0 5px rgba(177,112,239,.08), 0 0 28px rgba(168,85,247,.28);
  color: var(--purple-bright); font-size: 42px; font-weight: 600;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
h1 { margin: 0; color: var(--purple-bright); font-size: 27px; font-weight: 650; letter-spacing: .5px; text-shadow: 0 0 22px rgba(189,131,245,.28); }
.tagline { margin: 9px 0 18px; color: var(--muted); font-size: 13px; line-height: 1.65; }
.status {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid rgba(189,131,245,.25);
  background: rgba(124,58,180,.10);
  color: #d7b6f7; border-radius: 99px; padding: 6px 11px;
  font-size: 10px; letter-spacing: 1.5px; margin-bottom: 18px;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: #b783e9; box-shadow: 0 0 9px #b783e9; }
.music {
  display: flex; align-items: center; gap: 12px;
  text-align: left; padding: 12px;
  border: 1px solid rgba(190,125,255,.20);
  background: rgba(0,0,0,.22);
  border-radius: 13px; margin: 0 0 17px;
}
.disc {
  flex: 0 0 39px; width: 39px; height: 39px; border-radius: 50%;
  display: grid; place-items: center; color: #e9d4ff;
  background: radial-gradient(circle, #100b16 0 19%, #9a5bc7 20% 24%, #21142c 25% 100%);
  border: 1px solid rgba(211,170,255,.55);
}
.disc.playing { animation: spin 4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
.track { min-width: 0; flex: 1; }
.track strong { display: block; font-size: 12px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.track span { display: block; color: #a99bb7; font-size: 10px; margin-top: 4px; }
.play {
  border: 1px solid rgba(195,146,242,.45); border-radius: 50%;
  width: 34px; height: 34px; background: rgba(132,77,175,.18);
  color: #f4e9ff; cursor: pointer; font-size: 13px;
}
.play:hover, .link:hover { background: rgba(139,82,190,.35); border-color: #c99af7; transform: translateY(-1px); }
.volume { width: 65px; accent-color: #bb83ef; cursor: pointer; }
.links { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
.link {
  color: #e8d5fb; text-decoration: none; font-size: 12px;
  padding: 9px 13px; border: 1px solid rgba(190,125,255,.30);
  border-radius: 9px; background: rgba(0,0,0,.17);
  transition: .2s ease;
}
.link:focus-visible, button:focus-visible { outline: 2px solid #e0baff; outline-offset: 3px; }
footer { color: #81718f; font-size: 10px; margin-top: 21px; letter-spacing: .5px; }
#intro {
  position: fixed; inset: 0; z-index: 5;
  display: grid; place-content: center; justify-items: center; gap: 15px;
  background: #08060b; transition: opacity .7s ease, visibility .7s ease;
}
#intro h2 { margin: 0; color: #dfbaff; font-size: 22px; letter-spacing: 6px; text-shadow: 0 0 24px #a855f7; }
#intro p { margin: 0; color: #9988a8; font-size: 11px; letter-spacing: 2px; }
#intro button {
  margin-top: 8px; color: #f7edff; background: rgba(91,49,125,.28);
  border: 1px solid #a96bd9; border-radius: 8px; padding: 11px 30px;
  font-size: 11px; letter-spacing: 3px; cursor: pointer; transition: .2s;
}
#intro button:hover { background: rgba(139,82,190,.45); box-shadow: 0 0 22px #a855f755; }
#intro.hidden { opacity: 0; visibility: hidden; }
@media (max-width: 420px) {
  .card { padding: 26px 19px 20px; }
  h1 { font-size: 24px; }
  .volume { width: 52px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<canvas id="particles" aria-hidden="true"></canvas>

<div id="intro">
  <h2>† KARGA †</h2>
  <p>WELCOME TO MY SPACE</p>
  <button id="enterBtn" type="button">ENTER</button>
</div>

<div class="wrap">
  <main class="card">
    <div class="status"><span class="dot"></span> PERSONAL PROFILE</div>
    <div class="avatar" id="avatar">K</div>
    <h1>† Helena Karga †</h1>
    <p class="tagline">My art carries the feelings<br>my voice never could.</p>

    <section class="music" aria-label="Music player">
      <div class="disc" id="disc" aria-hidden="true">♫</div>
      <div class="track">
        <strong id="trackTitle">No track loaded</strong>
        <span id="trackArtist">Add your music file to assets/music.mp3</span>
      </div>
      <button class="play" id="playBtn" type="button" aria-label="Play music">▶</button>
      <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.65" aria-label="Volume">
    </section>

    <nav class="links" aria-label="Social links">
      <a class="link" href="https://discord.com/" target="_blank" rel="noopener noreferrer">Discord ↗</a>
      <a class="link" href="https://steamcommunity.com/" target="_blank" rel="noopener noreferrer">Steam ↗</a>
      <a class="link" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube ↗</a>
    </nav>
    <footer>MADE BY KARGA · 2026</footer>
  </main>
</div>

<audio id="audio" preload="none" loop>
  <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<script>
const intro = document.getElementById('intro');
const enterBtn = document.getElementById('enterBtn');
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const volume = document.getElementById('volume');
const disc = document.getElementById('disc');

enterBtn.addEventListener('click', async () => {
  intro.classList.add('hidden');
  try {
    await audio.play();
    setPlaying(true);
  } catch (_) {
    // Browsers may block playback until the user presses Play.
  }
});
function setPlaying(playing) {
  playBtn.textContent = playing ? 'Ⅱ' : '▶';
  playBtn.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
  disc.classList.toggle('playing', playing);
}
playBtn.addEventListener('click', async () => {
  if (audio.paused) {
    try { await audio.play(); } catch (_) {
      document.getElementById('trackArtist').textContent = 'Add assets/music.mp3 to enable music';
    }
  } else {
    audio.pause();
  }
});
audio.addEventListener('play', () => setPlaying(true));
audio.addEventListener('pause', () => setPlaying(false));
audio.addEventListener('error', () => {
  document.getElementById('trackTitle').textContent = 'No track loaded';
});
volume.addEventListener('input', () => { audio.volume = Number(volume.value); });
audio.volume = Number(volume.value);

// Subtle ambient particles; no external libraries required.
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const count = Math.min(42, Math.floor(innerWidth / 24));
  particles = Array.from({length: count}, () => ({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    r: .5 + Math.random() * 1.5,
    v: .12 + Math.random() * .35,
    a: .18 + Math.random() * .42
  }));
}
function drawParticles() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of particles) {
    p.y -= p.v;
    if (p.y < -4) { p.y = innerHeight + 4; p.x = Math.random() * innerWidth; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(205, 158, 255, ${p.a})`;
    ctx.fill();
  }
  requestAnimationFrame(drawParticles);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
drawParticles();
</script>
</body>
</html>
